appId: com.traveloka.android.staging
---

# Navigate to the search results screen
- launchApp
- assertVisible:
    id: "home_screen"  # Verify app launched to home screen
- tapOn:
    id: "flights_tile"  # Tap "Flights" tile on home screen
- assertVisible:
    id: "search_tab"  # Verify search form is displayed
- tapOn:
    id: "btn_search"  # Tap "Search" button to navigate to results
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to appear (up to 30s)

# Scroll down on the results list multiple times to trigger pagination
- scroll  # First scroll down
- scroll  # Second scroll down
- scroll  # Third scroll down

# Verify that flight cards are still visible after scrolling
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Ensure flight cards are still visible after scrolling