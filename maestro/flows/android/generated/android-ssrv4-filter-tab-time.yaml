appId: com.traveloka.android.staging
name: android-ssrv4-filter-tab-time
---

# Test Case: SSR V4 Multi-Filter: Departure Time Tab
# Description: Navigate to Time tab in multi-filter dialog, select morning departure
# Priority: p0

# Step 1: Stop the app and navigate to the Flight Search Results screen using a deeplink
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open full filter dialog
- tapOn:
    id: "flight_result_filter_button_title"
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Step 3: Scroll to departure time section
- scrollUntilVisible:
    element:
      id: "button_departure_morning"
    direction: DOWN
    timeout: 15000

# Step 4: Tap the morning departure option
- tapOn:
    id: "button_departure_morning"

# Step 5: Apply the filter
- tapOn:
    id: "dbwShow"

# Step 6: Wait for results to reload
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 7: Assert results visible
- assertVisible:
    id: "card_result"