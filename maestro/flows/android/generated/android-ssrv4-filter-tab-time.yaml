appId: com.traveloka.android.staging
---

# Step 1: Navigate to search results
- launchApp
- tapOn:
    id: "flights_tile"  # Tap "Flights" tile on home screen
- assertVisible:
    id: "search_tab"  # Verify search form is visible
- tapOn:
    id: "btn_search"  # Tap "Search" button to navigate to results
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait up to 30s for flight cards to appear

# Step 2: Wait for filter button to be visible
- extendedWaitUntil:
    id: "flight_result_v4_filter_button"  # Wait for filter button to appear

# Step 3: Open filter dialog
- tapOn:
    id: "flight_result_v4_filter_button"  # Tap filter button to open filter dialog
- extendedWaitUntil:
    id: "layout_filter_dialog"  # Wait for filter dialog to appear

# Step 4: Navigate to Time tab in filter dialog
- tapOn:
    id: "filter_tab_time"  # Tap the Time tab in FilterTopTabBar

# Step 5: Select morning departure option
- tapOn:
    id: "button_departure_morning"  # Tap morning departure option

# Step 6: Apply the filter
- tapOn:
    id: "dbwShow"  # Tap Apply button to apply the filter

# Step 7: Wait for results to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to reload

# Step 8: Verify results are visible
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Assert flight cards are visible