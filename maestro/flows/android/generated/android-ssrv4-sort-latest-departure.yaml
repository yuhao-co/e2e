appId: com.traveloka.android.staging
---
# Step 1: Launch the app and navigate to the flight search results page
- launchApp
- extendedWaitUntil:
    id: "home_screen" # Wait for the home screen to load
- tapOn:
    id: "flights_tile" # Tap on the "Flights" tile on the home screen
- extendedWaitUntil:
    id: "search_tab" # Wait for the search form to appear
- tapOn:
    id: "btn_search" # Tap the "Search" button to initiate the flight search
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Wait for the flight results to load (up to 30 seconds)

# Step 2: Wait for the sort button to appear
- extendedWaitUntil:
    id: "flight_result_v4_sort_button" # Ensure the sort button is visible

# Step 3: Open the sort tray
- tapOn:
    id: "flight_result_v4_sort_button" # Tap the sort button to open the sort tray

# Step 4: Wait for the sort tray to appear
- extendedWaitUntil:
    id: "radio_button" # Wait for the sort tray to load

# Step 5: Select "Latest Departure" sort option
- tapOn:
    id: "radio_button"
    index: 3 # Tap the radio button at index 3 (Latest Departure)

# Step 6: Wait for the flight results to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Wait for the flight results to reload

# Step 7: Verify that the app did not crash and results are visible
- assertVisible:
    id: "flight_result_v4_inventory_card" # Verify that flight cards are visible after sorting