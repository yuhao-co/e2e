appId: com.traveloka.android.staging
name: android-results-airline-filter
---
# Scenario: Airline Filter via Bottom Sheet
# Description: Open FULL filter dialog via flight_result_v4_filter_button, scroll to reach layer_airline, tap check_box index 0, apply with dbwShow
# Priority: p1

# Step 1: Navigate to search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open the full filter dialog
- tapOn:
    id: "flight_result_filter_button_title"  # Opens FlightResultRevampFilterDialog
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Step 3: Scroll to reach airline section
- scrollUntilVisible:       # [fix: replaced bare scroll with scrollUntilVisible to ensure correct behavior]
    element:
      id: "layer_airline"
    direction: DOWN
    timeout: 15000

# Step 4: Tap the first airline checkbox
- tapOn:
    id: "check_box"             # First airline checkbox (flight_filter_airline_adapter_item.xml verified)

# Step 5: Apply the filter
- tapOn:
    id: "dbwShow"              # Apply button (NOT tvResult)
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 6: Assert that the inventory card is visible
- assertVisible:
    id: "card_result"  # Verify that the airline filter applied and cards updated