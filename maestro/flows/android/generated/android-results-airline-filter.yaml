appId: com.traveloka.android.staging
name: android-results-airline-filter
---
- launchApp
- tapOn:
    text: "Flights"
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000
- tapOn:
    id: "flight_result_v4_filter_button"
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000
- scroll
- extendedWaitUntil:
    visible:
      id: "layer_airline"
    timeout: 10000
- tapOn:
    id: "check_box"
    index: 0
- tapOn:
    id: "dbwShow"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"
    timeout: 30000
- assertVisible:
    id: "flight_result_v4_inventory_card"
