##
# SCENARIO 17 — Date Flow: Tap adjacent date in the price calendar strip
#
# Source contract (android-v3 @ 2026-06-11):
#   flight_result_revamp_activity.xml  →  widget_dateflow
#   FlightResultScreen.kt              →  dateFlowRecycler withId(R.id.recycler_date)
#                                         isDescendantOfA widget_dateflow
#   DateFlowItem                       →  text_price, text_date
#
# Expected: Tapping a neighbouring date in the date-flow strip triggers
#           a new search; result_container remains visible after reload.
#
# Generated: 2026-06-11
##
appId: com.traveloka.android.staging
---

- runFlow: ../_navigate_to_results.yaml

# Date-flow strip at the top of results
- assertVisible:
    id: "flight_result_v4_date_flow_row"

# Tap the second date item in the strip (index 1 = next available date)
- tapOn:
    id: "text_date"
    index: 1

# Results reload
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- assertVisible:
    id: "flight_result_v4_inventory_card"
