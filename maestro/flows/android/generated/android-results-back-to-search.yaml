appId: com.traveloka.android.staging
name: android-results-back-to-search
---
# Test case for navigating back to the search form from flight search results
# Scenario ID: android-results-back-to-search
# Description: Use system back gesture to return to search form
# Priority: p0

# Step 1: Navigate to search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Wait for text_result_title (Compose id)
- extendedWaitUntil:
    visible:
      id: "text_result_title"
    timeout: 30000  # [fix: ensure sufficient time for the toolbar title to appear]

# Step 3: Execute system back gesture
- back

# Step 4: Assert we leave the results page
- extendedWaitUntil:  # [fix: replaced assertVisible with extendedWaitUntil to ensure proper timeout handling]
    notVisible:
      id: "text_result_title"
    timeout: 30000  # [fix: ensure sufficient time to confirm the results page is exited]