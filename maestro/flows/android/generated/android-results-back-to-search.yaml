appId: com.traveloka.android.staging
name: android-results-back-to-search
---
# Step 1: Launch the app
- launchApp
# Step 2: Tap on the "Flights" tile to navigate to the search form
- tapOn:
    text: "Flights"      # Home screen product tile has NO android:id — text match is the ONLY contract
# Step 3: Assert that the search tab is visible
- assertVisible:
    id: "search_tab"
# Step 4: Tap on the search tab
- tapOn:
    id: "search_tab"
# Step 5: Assert that the search button is visible
- assertVisible:
    id: "btn_search"
# Step 6: Tap on the search button to initiate the flight search
- tapOn:
    id: "btn_search"     # btn_search is the blue Search CTA (hangar_widget.xml line 209)
# Step 7: Assert that the flight results page header is visible
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
# Step 8: Wait until the flight inventory card is visible
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000
# Step 9: Wait for the flight results page header to ensure we are on the results page
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"
    timeout: 30000
# Step 10: Execute system back gesture to return to the search form
- back
# Step 11: Assert that the flight results page header is no longer visible
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"  # This should fail, confirming we have left the results page