appId: com.traveloka.android.staging
---
# Step 1: Navigate to search results
- launchApp
- tapOn:
    id: "flights_tile"  # Tap "Flights" tile on home screen
- tapOn:
    id: "btn_search"  # Tap "Search" button on search form
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to appear (up to 30s)

# Step 2: Wait for filter button to be visible
- extendedWaitUntil:
    id: "flight_result_v4_filter_button"  # Ensure filter button is visible

# Step 3: Tap the filter button
- tapOn:
    id: "flight_result_v4_filter_button"  # Open filter dialog

# Step 4: Wait for filter dialog to appear
- extendedWaitUntil:
    id: "layout_filter_dialog"  # Wait for filter dialog to load

# Step 5: Tap the Price tab in FilterTopTabBar
- tapOn:
    id: "filter_tab_price"  # Open the Price tab in the filter dialog

# Step 6: Adjust the price range slider
- scroll  # Simulate a swipe/scroll to adjust the price range slider slightly

# Step 7: Tap the Apply button
- tapOn:
    id: "dbwShow"  # Apply the selected filters

# Step 8: Wait for flight cards to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to reload

# Success Criteria: Verify that the Price tab is navigable and the filter is applied
- assertVisible:
    id: "filter_tab_price"  # Verify that the Price tab is navigable
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Verify that flight cards are displayed after applying the filter