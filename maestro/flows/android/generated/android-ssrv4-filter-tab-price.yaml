appId: com.traveloka.android.staging
name: android-ssrv4-filter-tab-price
---

# Step 1: Stop the app and navigate to the flight search results page using a deeplink
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open full filter dialog
- tapOn:
    id: "flight_result_filter_button_title"
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Step 3: Scroll to price section (smoke: verify it renders without crash)
- scrollUntilVisible:
    element:
      id: "layer_price"
    direction: DOWN
    timeout: 15000

# Step 4: Close filter without interaction (price slider has no stable ID)
- tapOn:
    id: "ivClose"

# Step 5: Wait for results to remain visible
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 6: Assert results visible
- assertVisible:
    id: "card_result"