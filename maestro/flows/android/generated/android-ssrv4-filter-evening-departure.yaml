appId: com.traveloka.android.staging
---
# Navigate to the search results screen
- launchApp
- tapOn:
    id: "continue_button" # Dismiss optional onboarding
- tapOn:
    id: "flights_tile" # Tap "Flights" tile on home screen
- tapOn:
    id: "btn_search" # Tap "Search" button on search form
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Wait for flight cards to appear (up to 30s)

# Open the filter dialog
- tapOn:
    id: "flight_result_v4_filter_button" # Tap Filter button
- extendedWaitUntil:
    id: "layout_filter_dialog" # Wait for filter dialog to appear

# Apply Evening departure filter
- tapOn:
    id: "time_tab" # Tap the Time tab in the filter dialog
- tapOn:
    id: "button_departure_evening" # Tap Evening departure option
- tapOn:
    id: "tvResult" # Tap Apply button

# Verify filter application
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Wait for flight cards to reload or empty state
- assertVisible:
    id: "flight_result_v4_inventory_card" # Ensure flight cards are visible (filter applied successfully)