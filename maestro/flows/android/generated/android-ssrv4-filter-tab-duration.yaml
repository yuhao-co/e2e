appId: com.traveloka.android.staging
name: android-ssrv4-filter-tab-duration
---

# Step 1: Stop the app and navigate to the Flight Search Results screen using a deeplink
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open full filter dialog
- tapOn:
    id: "flight_result_filter_button_title"
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Smoke: scroll down in filter dialog (duration slider has no stable ID)
# Goal: verify dialog opens and renders duration section without crash
- scroll
- scroll

# Close without applying
- tapOn:
    id: "ivClose"

# Verify results still visible (no crash)
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000
- assertVisible:
    id: "card_result"