appId: com.traveloka.android.staging
name: android-ssrv4-filter-tab-airlines
---

# Step 1: Stop the app and navigate to the flight search results page using a deeplink
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open full filter dialog
- tapOn:
    id: "flight_result_filter_button_title"
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Step 3: Scroll to airlines section
- scrollUntilVisible:
    element:
      id: "layer_airline"
    direction: DOWN
    timeout: 15000

# Step 4: Tap the first airline checkbox
- tapOn:
    id: "check_box"

# Step 5: Apply the filter
- tapOn:
    id: "dbwShow"

# Step 6: Wait for results to reload
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 7: Assert results visible
- assertVisible:
    id: "card_result"