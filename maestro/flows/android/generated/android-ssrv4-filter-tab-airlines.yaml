appId: com.traveloka.android.staging
---

# Step 1: Launch the app and navigate to the flight search results page
- launchApp
- tapOn:
    id: "button_continue" # Dismiss optional onboarding
- tapOn:
    id: "flights_tile" # Tap "Flights" tile on home screen
- tapOn:
    id: "btn_search" # Tap "Search" button on the search form
- extendedWaitUntil: # Wait for flight cards to appear
    id: "flight_result_v4_inventory_card"

# Step 2: Wait for the filter button to be visible
- extendedWaitUntil:
    id: "flight_result_v4_filter_button"

# Step 3: Tap the filter button to open the filter dialog
- tapOn:
    id: "flight_result_v4_filter_button"

# Step 4: Wait for the filter dialog to appear
- extendedWaitUntil:
    id: "layout_filter_dialog"

# Step 5: Tap the Airlines tab in the filter dialog
- tapOn:
    id: "filter_tab_airlines" # Navigate to Airlines tab in FilterTopTabBar

# Step 6: Tap the first airline item in the airline list
- tapOn:
    id: "recycler_view_airline_item" # Select the first airline in the list
    index: 0

# Step 7: Tap the Apply button to apply the filter
- tapOn:
    id: "dbwShow" # Apply the selected airline filter

# Step 8: Wait for the flight results to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"

# Success Criteria: Verify that the airline filter is applied and results are visible
- assertVisible:
    id: "flight_result_v4_inventory_card" # Ensure flight cards are visible after applying the filter
- assertVisible:
    id: "flight_result_v4_filter_button" # Ensure the filter button is still visible after applying the filter