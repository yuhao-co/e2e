appId: com.traveloka.android.staging
---

# Step 1: Launch the app and navigate to the flight search results screen
- launchApp
- tapOn:
    id: "button_continue" # Dismiss optional onboarding
- tapOn:
    id: "flights_tile" # Tap "Flights" tile on home screen
- tapOn:
    id: "btn_search" # Tap "Search" button on the search form
- extendedWaitUntil: # Wait up to 30 seconds for flight cards to appear
    timeout: 30000
    visible:
      id: "flight_result_v4_inventory_card"

# Step 2: Wait for the filter button to be visible
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "flight_result_v4_filter_button"

# Step 3: Tap the filter button to open the filter dialog
- tapOn:
    id: "flight_result_v4_filter_button"

# Step 4: Wait for the filter dialog to appear
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "layout_filter_dialog"

# Step 5: Tap the Airports tab in the FilterTopTabBar
- tapOn:
    id: "filter_tab_airports" # Assuming this is the ID for the Airports tab

# Step 6: Tap the first departure airport option in the airports list
- tapOn:
    id: "recycler_view_airports" # Assuming this is the ID for the airports list
    index: 0 # Select the first airport option

# Step 7: Tap the Apply button to apply the filter
- tapOn:
    id: "tvResult" # Apply button in the filter dialog

# Step 8: Wait for the flight results to reload
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "flight_result_v4_inventory_card"

# Success Criteria: Verify that the Airports tab is navigable and the filter is applied
- assertVisible:
    id: "filter_tab_airports" # Verify Airports tab is navigable
- assertVisible:
    id: "flight_result_v4_inventory_card" # Verify flight results reload without crash