appId: com.traveloka.android.staging
name: android-results-departure-time-filter
---
# Test case for applying the morning departure filter in flight search results
# Scenario ID: android-results-departure-time-filter
# Description: Open FULL filter dialog, scroll to reach layer_time, tap button_departure_morning, apply with dbwShow

# Step 1: Navigate to search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open the full filter dialog
- tapOn:
    id: "flight_result_filter_button_title"  # Opens FlightResultRevampFilterDialog
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Step 3: Scroll to the departure time section
- scrollUntilVisible:
    element:
      id: "button_departure_morning"
    direction: DOWN
    timeout: 15000  # Ensure we can reach the button

# Step 4: Tap the morning departure button
- tapOn:
    id: "button_departure_morning"

# Step 5: Apply the filter
- tapOn:
    id: "dbwShow"  # Apply button in the filter dialog

# Step 6: Wait for the results to update
- extendedWaitUntil:     # [fix: added extended wait to ensure the results page is fully updated after applying the filter]
    visible:
      id: "card_result"
    timeout: 30000

# Step 7: Assert that the inventory card is visible, confirming the filter was applied
- assertVisible:
    id: "card_result"