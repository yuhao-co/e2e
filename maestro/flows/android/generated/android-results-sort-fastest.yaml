appId: com.traveloka.android.staging
name: android-results-sort-fastest
---
- launchApp
- tapOn:
    text: "Flights"
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000
- tapOn:
    id: "bm_button"
- extendedWaitUntil:
    visible:
      id: "rbg_sort"
    timeout: 10000
- tapOn:
    id: "radio_button"
    index: 1
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"
    timeout: 30000
- assertVisible:
    id: "flight_result_v4_inventory_card"
