appId: com.traveloka.android.staging
---
# P0: Sort by Cheapest
# Verified IDs: UIAutomator dump 2026-06-11
# Sort tray: layout_tray, radio_button (index 0 = Cheapest/LOWEST_PRICE)

- launchApp
- tapOn:
    text: "Flights"
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Tap sort pill (bm_button — Bloom DS, 1 instance confirmed in UIAutomator dump)
- tapOn:
    id: "bm_button"
- extendedWaitUntil:
    visible:
      id: "layout_tray"
    timeout: 10000

# Tap Cheapest (radio_button index 0 = LOWEST_PRICE, confirmed in sort tray dump)
- tapOn:
    id: "radio_button"
    index: 0

- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000
- assertVisible:
    id: "flight_result_v4_inventory_card"
