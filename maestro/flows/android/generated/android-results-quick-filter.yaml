appId: com.traveloka.android.staging
---

- runFlow: ../_navigate_to_results.yaml

# Quick-filter chips appear just below the sticky header
- assertVisible:
    id: "quick_filter_item"
# Tap first quick-filter pill (index 0)
- tapOn:
    id: "quick_filter_item"
    index: 0

