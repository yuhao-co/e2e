appId: com.traveloka.android.staging
---

- runFlow: ../_navigate_to_results.yaml

# Tap the detail info icon on the first card
- tapOn:
    id: "image_info_detail"
    index: 0

# Detail / info panel appears
- assertVisible:
    id: "dialog_toolbar"
- assertVisible:
    id: "sliding_tabs"

# Close
- tapOn:
    id: "image_view_close"

# ── Assertions: Back on results ───────────────────────────────────────────────
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
