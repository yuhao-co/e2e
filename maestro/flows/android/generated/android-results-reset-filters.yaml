appId: com.traveloka.android.staging
---
# Step 1: Launch the app
- launchApp

# Step 2: Tap on the "Flights" product tile to navigate to the search results
- tapOn:
    text: "Flights"  # Home screen product tile has NO android:id — text match is the ONLY contract

# Step 3: Assert that the search tab is visible
- assertVisible:
    id: "search_tab"

# Step 4: Tap on the search tab
- tapOn:
    id: "search_tab"

# Step 5: Assert that the search button is visible
- assertVisible:
    id: "btn_search"

# Step 6: Tap on the search button to initiate the flight search
- tapOn:
    id: "btn_search"  # btn_search is the blue Search CTA (hangar_widget.xml line 209)

# Step 7: Assert that the flight results page header is visible
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"

# Step 8: Wait until the flight inventory card is visible
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 9: Tap on a quick filter item to open the filter dialog
- tapOn:
    id: "flight_result_v4_quick_filter_cell"  # Assuming this ID corresponds to the quick filter item

# Step 10: Wait for the filter dialog to be visible
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"

# Step 11: Tap on the button to select the direct filter
- tapOn:
    id: "button_direct"

# Step 12: Tap on the reset button to clear all filters
- tapOn:
    id: "tvReset"  # tvReset is the ID for resetting filters in the filter dialog

# Step 13: Tap on the result button to apply with no filters
- tapOn:
    id: "tvResult"  # tvResult is the ID for applying the filters

# Step 14: Wait for the flight inventory card to reload
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 15: Assert that the flight result container view is visible
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Verifying that the results are displayed after reset