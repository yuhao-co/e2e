appId: com.traveloka.android.staging
name: android-results-reset-filters
---
# Test case for resetting all filters in the flight search results
# Scenario ID: android-results-reset-filters
# Description: Open FULL filter dialog, apply direct filter, tap tvReset to clear, apply with dbwShow

# Step 1: Navigate to search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open the full filter dialog
- tapOn:
    id: "flight_result_filter_button_title"  # Opens FlightResultRevampFilterDialog
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Step 3: Apply direct filter
- tapOn:
    id: "button_direct"  # Select direct filter first so tvReset has something to clear

# Step 4: Reset all filters
- tapOn:
    id: "tvReset"  # Reset All button (flight_result_revamp_filter_dialog.xml verified)

# Step 5: Apply with no filters active
- tapOn:
    id: "dbwShow"  # Apply button with no filters active (NOT tvResult)

# Step 6: Wait for results to load
- extendedWaitUntil:      # [fix: added extendedWaitUntil to ensure results are fully loaded]
    visible:
      id: "card_result"
    timeout: 30000

# Step 7: Assert that inventory cards are visible
- assertVisible:
    id: "card_result"  # All filters cleared, full result set restored