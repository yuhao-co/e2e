appId: com.traveloka.android.staging
name: android-results-filter-multi-stop
---
# Step 1: Navigate to search results
- launchApp
- tapOn:
    text: "Flights"      # Home screen product tile has NO android:id — text match is the ONLY contract
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"     # btn_search is the blue Search CTA (hangar_widget.xml line 209)
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 2: Wait for flight_result_v4_navbar_toolbar_title (Compose id)
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"
    timeout: 30000

# Step 3: Tap quick_filter_item to open filter dialog
- tapOn:
    id: "flight_result_v4_filter_button"  # Tap the filter button to open the filter dialog

# Step 4: Wait for layout_filter_dialog (id)
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 30000

# Step 5: Tap button_two_transit (id)
- tapOn:
    id: "button_two_transit"  # Apply 2+ Stops filter

# Step 6: Tap tvResult to apply (id)
- tapOn:
    id: "tvResult"  # Apply the filter selections

# Step 7: Wait for flight_result_v4_navbar_toolbar_title reload
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"
    timeout: 30000

# Success Criteria: Verify that the 2+ stop filter is applied
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Check that the results are visible after applying the filter