appId: com.traveloka.android.staging
name: android-results-filter-multi-stop
---
# Step 1: Launch the app
- launchApp

# Step 2: Tap on "Flights" to navigate to the flight search
- tapOn:
    text: "Flights"  # Home screen product tile — no testTag, text-only contract

# Step 3: Assert that the search tab is visible
- assertVisible:
    id: "search_tab"

# Step 4: Tap on the search tab
- tapOn:
    id: "search_tab"

# Step 5: Assert that the search button is visible
- assertVisible:
    id: "btn_search"

# Step 6: Tap on the search button to initiate the search
- tapOn:
    id: "btn_search"

# Step 7: Assert that the flight results page header is visible
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"

# Step 8: Wait until the flight inventory card is visible
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 9: Tap on the filter button to open the full filter dialog
- tapOn:
    id: "flight_result_v4_filter_button"

# Step 10: Wait for the filter dialog to be visible
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Step 11: Tap on the button for 2+ stops
- tapOn:
    id: "button_two_transit"

# Step 12: Tap on the apply button to apply the filter
- tapOn:
    id: "dbwShow"  # Correct apply button in the filter dialog

# Step 13: Wait for the flight results page header to reload
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"
    timeout: 30000

# Success criteria: Assert that the results or empty-state is visible
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Check if results are displayed after applying the filter