appId: com.traveloka.android.staging
name: android-results-filter-multi-stop
---
# Step 1: Launch the app and navigate to the search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open the filter dialog
- tapOn:
    id: "flight_result_filter_button_title"  # Open full filter dialog
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"           # Wait for filter dialog to appear
    timeout: 15000

# Step 3: Apply the 2+ Stops filter
- tapOn:
    id: "button_two_transit"               # Select 2+ Stops filter option
- tapOn:
    id: "dbwShow"                          # Apply the filter (correct apply button)

# Step 4: Wait for the results to reload
- extendedWaitUntil:
    visible:
      id: "text_result_title"  # Wait for results to reload after applying filter
    timeout: 30000

# Success criteria: Verify that the results or empty-state is visible
- assertVisible:
    id: "card_result"  # Check that results are displayed after applying the filter