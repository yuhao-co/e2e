appId: com.traveloka.android.staging
name: android-ssrv4-mini-filter-tray-open
---

# CORRECTED: SSR V4 Filter Dialog Opens (quick filter chips removed in SSR V4)
# Use full Filter Dialog instead

- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Open filter dialog
- tapOn:
    id: "flight_result_filter_button_title"

# Wait for filter dialog to appear
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Assert dialog is visible
- assertVisible:
    id: "layout_filter_dialog"

# Close without applying
- tapOn:
    id: "ivClose"

# Verify results still visible
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 15000