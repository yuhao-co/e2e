appId: com.traveloka.android.staging
---
# Step 1: Navigate to search results
# Precondition: App launches to home screen, onboarding dismissed, Flights tile tapped, search form pre-filled, and Search button tapped
- launchApp
- tapOn:
    id: "flights_tile"  # Tap on Flights tile
- tapOn:
    id: "btn_search"  # Tap on Search button in the search form
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to appear (up to 30s)

# Step 2: Wait for filter button to be visible
- extendedWaitUntil:
    id: "flight_result_v4_filter_button"  # Wait for the filter button to be visible

# Step 3: Tap on the filter button
- tapOn:
    id: "flight_result_v4_filter_button"  # Open the filter dialog

# Step 4: Wait for filter dialog to appear
- extendedWaitUntil:
    id: "layout_filter_dialog"  # Wait for the filter dialog to be visible

# Step 5: Tap the Time tab
- tapOn:
    id: "layer_transit"  # Open the Time tab in the filter dialog

# Step 6: Tap Morning arrival option
- tapOn:
    id: "button_arrival_morning"  # Select the Morning arrival filter option

# Step 7: Tap Apply button
- tapOn:
    id: "dbwShow"  # Apply the selected filter

# Step 8: Wait for flight cards to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for the flight cards to reload

# Success Criteria: Verify that the results are updated
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Ensure flight cards are visible after applying the filter