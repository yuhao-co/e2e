appId: com.traveloka.android.staging
---
# Step 1: Launch the app and navigate to the search results screen
- launchApp
- tapOn:
    id: "button_continue" # Dismiss optional onboarding
- tapOn:
    id: "flights_tile" # Tap "Flights" tile on home screen
- tapOn:
    id: "btn_search" # Tap "Search" button on the search form
- extendedWaitUntil: # Wait up to 30s for flight cards to appear
    id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 2: Wait for the quick filter chips to be visible
- extendedWaitUntil:
    id: "flight_result_v4_quick_filter_cell"

# Step 3: Tap the first chip in the quick filter to open the mini-filter tray
- tapOn:
    id: "flight_result_v4_quick_filter_cell"
    index: 0

# Step 4: Wait for the mini-filter tray (bottom sheet) to appear
- extendedWaitUntil:
    id: "layout_filter_dialog"

# Step 5: Tap the "Apply" button in the mini-filter tray
- tapOn:
    id: "dbwShow" # Apply button in the filter dialog

# Step 6: Wait for the flight results to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"

# Step 7: Assert that the flight results are visible
- assertVisible:
    id: "flight_result_v4_inventory_card"