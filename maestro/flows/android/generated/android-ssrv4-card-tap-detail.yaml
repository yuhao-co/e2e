appId: com.traveloka.android.staging
---
# Step 1: Launch the app and navigate to the search results screen
- launchApp
- extendedWaitUntil:
    id: "button_continue"
- tapOn:
    id: "button_continue" # Dismiss optional onboarding
- extendedWaitUntil:
    id: "flights_tile" # Wait for Flights tile on home screen
- tapOn:
    id: "flights_tile" # Tap Flights tile
- extendedWaitUntil:
    id: "btn_search" # Wait for search form to load
- tapOn:
    id: "btn_search" # Tap Search button
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Wait for flight cards to appear (up to 30s)

# Step 2: Tap the first flight card to open the detail screen
- tapOn:
    id: "flight_result_v4_inventory_card" # Tap the first flight card
    index: 0
- extendedWaitUntil:
    id: "flight_detail_screen" # Wait for detail screen to appear (new activity or bottom sheet)

# Step 3: Take a screenshot of the detail screen
- takeScreenshot: "test-results/android/android-ssrv4-card-detail.png"

# Step 4: Return to the search results screen
- back # Tap system back to return to the results screen

# Step 5: Verify the results screen is visible again
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Assert flight cards are visible again