##
# SCENARIO 12 — Card: Tap flight card to open detail dialog
#
# Source contract (android-v3 @ 2026-06-11):
#   flight_result_card.xml  →  inventory_parent_layout, card_result,
#                               flight_revamp_see_details_tap_area,
#                               flight_revamp_see_details_variant_text
#   flight_detail_dialog.xml → dialog_toolbar, image_view_close,
#                               text_view_dialog_title, bSelect, dbwSelect
#
# Generated: 2026-06-11
##
appId: com.traveloka.android.staging
---

- runFlow: ../_navigate_to_results.yaml

# Tap the first visible flight card
- tapOn:
    id: "flight_result_v4_inventory_card"
    index: 0

# Detail dialog must appear
- assertVisible:
    id: "dialog_toolbar"
- assertVisible:
    id: "text_view_dialog_title"

# Select button is the primary CTA on the detail dialog
- assertVisible:
    id: "bSelect"

# ── Close detail without selecting ───────────────────────────────────────────
- tapOn:
    id: "image_view_close"

# ── Assertions: Back on results ───────────────────────────────────────────────
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- assertVisible:
    id: "flight_result_v4_inventory_card"
