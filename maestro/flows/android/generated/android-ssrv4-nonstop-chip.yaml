appId: com.traveloka.android.staging
---
# Step 1: Launch the app and navigate to the search results screen
- launchApp
- assertVisible:
    id: "home_screen"  # Verify app launched to home screen
- tapOn:
    id: "flights_tile"  # Tap "Flights" tile on home screen
- assertVisible:
    id: "search_tab"  # Verify search form is visible
- tapOn:
    id: "btn_search"  # Tap "Search" button to navigate to results
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait up to 30s for flight cards to appear

# Step 2: Wait for the quick filter chips to load
- extendedWaitUntil:
    id: "flight_result_v4_quick_filter_cell"  # Wait for quick filter chips to load

# Step 3: Scroll horizontally to find the Nonstop chip if needed
- scroll  # Scroll horizontally to ensure the Nonstop chip is visible

# Step 4: Tap the Nonstop chip
- tapOn:
    id: "flight_result_v4_quick_filter_cell"  # Tap the Nonstop chip (index 0 corresponds to "Direct")

# Step 5: Wait for the flight results to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to reload

# Step 6: Verify that the flight results are visible
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Verify that flight cards are visible