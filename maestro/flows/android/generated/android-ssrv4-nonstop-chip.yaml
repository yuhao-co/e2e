appId: com.traveloka.android.staging
name: android-ssrv4-nonstop-chip
---

# CORRECTED: SSR V4 Direct Filter via Dialog (quick chips removed in SSR V4)

# Step 1: Stop the app and navigate to the flight search results page using a deeplink
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open filter dialog
- tapOn:
    id: "flight_result_filter_button_title"

# Step 3: Wait for dialog
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Step 4: Apply direct flight filter
- tapOn:
    id: "button_direct"

# Step 5: Tap apply button
- tapOn:
    id: "dbwShow"

# Step 6: Wait for results to reload
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 7: Assert results visible
- assertVisible:
    id: "card_result"