appId: com.traveloka.android.staging
name: android-results-scroll
---
# Step 1: Launch the app and navigate to the flight search results
- launchApp
- tapOn:
    text: "Flights"      # Home screen product tile has NO android:id — text match is the ONLY contract
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"     # btn_search is the blue Search CTA (hangar_widget.xml line 209)
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 2: Scroll through the results
- scroll              # Swipe up to load more flight cards
- scroll              # Swipe up again to load more flight cards

# Step 3: Assert that flight cards are still visible after scrolling
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Ensure that flight cards are still visible after scrolling