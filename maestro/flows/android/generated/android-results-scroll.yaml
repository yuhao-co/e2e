appId: com.traveloka.android.staging
name: android-results-scroll
---
# Step 1: Launch the app and navigate to the search results
- launchApp
- tapOn:
    text: "Flights"      # Home screen product tile — no testTag, text-only contract
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 2: Swipe up to scroll through the results
- scroll              # First swipe up to load more cards
- scroll              # Second swipe up to continue loading more cards

# Step 3: Assert that the flight result cards are still visible
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Ensure cards are still visible after scrolling