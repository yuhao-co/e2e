appId: com.traveloka.android.staging
name: android-results-scroll
---
# Step 1: Launch the app and navigate to the search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Scroll through the results
- scroll              # First scroll to load more cards
- scroll              # Second scroll to load more cards

# Step 3: Assert that the flight result cards are still visible
- assertVisible:
    id: "card_result"  # Ensure that the flight cards are still visible after scrolling