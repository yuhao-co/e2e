##
# P0 SUITE — All 9 P0 scenarios in a single flow (ONE app launch, no restart between scenarios)
#
# Why single flow: Each individual YAML restarts the app (clearState + launchApp),
# causing ~9 emulator restarts per run. This suite launches once, navigates to
# results, then runs all scenarios sequentially on the same page session.
#
# SCENARIOS:
#   01. Smoke      — Results page elements visible (header, date-flow, filter-bar, cards)
#   02. FilterDir  — Open filter dialog → select Direct → apply → results reload
#   03. FilterReset— Open filter dialog → select Direct → reset → apply empty → full results
#   04. Sort       — Tap sort button → tray opens → back → on results
#   05. CardDetail — Tap card → detail opens → back → on results
#   06. Scroll     — Scroll list twice → cards still visible
#   07. DateFlow   — Verify date-flow strip present (tap omitted: individual date
#                    items have no testTag, use text-based tap in P1)
#   08. BackNav    — System back → search form appears → re-navigate to results
#   09. ChangeSearch — Tap navbar chevron → search overlay opens
#
# ══════════════════════════════════════════════════════════════════════════════
# COMPOSE ID CONTRACT (mandatory — enforced in generate-maestro-android.ts)
# ══════════════════════════════════════════════════════════════════════════════
# The flight search results page (v4) is fully Jetpack Compose.
# Old android:id values from flight_result_revamp_activity.xml / flight_result_card.xml
# do NOT appear in the Accessibility tree and will ALWAYS fail in Maestro.
#
# FORBIDDEN (old XML IDs — never use on results page):
#   result_container, inventory_parent_layout, card_result, filter_non_sticky,
#   widget_dateflow, text_result_title, image_arrow_back, image_change_search,
#   text_number_of_transit, layout_tray, rbg_sort, dialog_toolbar
#
# CORRECT Compose semantic testTags (source: searchresult/v4/route/view/**/*.kt):
#   flight_result_v4_navbar_toolbar_title           ← header with route text
#   flight_result_v4_navbar_toolbar_subtitle_chevron← change-search chevron
#   flight_result_v4_date_flow_row                  ← date price calendar strip
#   flight_result_v4_filter_button                  ← "Filter" button
#   flight_result_v4_sort_button                    ← "Sort" button
#   flight_result_v4_quick_filter_cell              ← Stops / Airlines / Time chips
#   flight_result_v4_inventory_card                 ← each flight card
#   flight_result_v4_inventory_card_price_section   ← price on card
#   flight_result_v4_inventory_card_connector_view  ← duration/stops on card
#
# STILL XML (filter dialog and search form — NOT Compose migrated):
#   layout_filter_dialog, layer_transit, layer_airline, layer_time, layer_price
#   button_direct, button_one_transit, button_two_transit, tvReset, dbwShow
#   search_tab, btn_search, layout_search_form
#
# Source: traveloka/android-v3 @ develop (2026-06-11)
##
appId: com.traveloka.android.staging
clearState: true
---

# ══════════════════════════════════════════════════════════════════════════════
# SETUP: Fresh launch → navigate to flight search results (runs ONCE for all P0)
# ══════════════════════════════════════════════════════════════════════════════

# [search_form_activity] Launch app and reach home screen
- launchApp

# [home] Tap the "Flights" product tile (home screen is EN only; text match is stable)
- tapOn:
    text: "Flights"

# [flight_search_form_activity.xml] search_tab: bottom-nav Search tab (line 156)
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"

# [flight_search_form_hangar_widget.xml] btn_search: blue Search button (line 209)
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"

# [Compose: FlightResultV4NavbarView] Navbar appears as soon as results Activity starts
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"

# [Compose: FlightResultV4InventoryCardComposeView] First card visible = API data received
- assertVisible:
    id: "flight_result_v4_inventory_card"


# ══════════════════════════════════════════════════════════════════════════════
# SCENARIO 01 — SMOKE: Results page loads with all key elements visible
# ══════════════════════════════════════════════════════════════════════════════

# Header with route title (Singapore → Jakarta etc.)
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"

# Date-flow price calendar strip
# [Compose: FlightResultV4DateFlowComposeView, testTag: flight_result_v4_date_flow_row]
- assertVisible:
    id: "flight_result_v4_date_flow_row"

# Filter button (left side of filter bar)
# [Compose: FlightResultV4SortAndFilterView, testTag: flight_result_v4_filter_button]
- assertVisible:
    id: "flight_result_v4_filter_button"

# At least one flight card (results loaded)
- assertVisible:
    id: "flight_result_v4_inventory_card"


# ══════════════════════════════════════════════════════════════════════════════
# SCENARIO 02 — FILTER DIRECT: Open filter dialog, select Direct, apply
# ══════════════════════════════════════════════════════════════════════════════

# Open filter dialog (XML bottom sheet — layout_filter_dialog still XML-based)
- tapOn:
    id: "flight_result_v4_filter_button"
- assertVisible:
    id: "layout_filter_dialog"

# Navigate to Stops/Transit layer
- tapOn:
    id: "layer_transit"
- assertVisible:
    id: "button_direct"

# Select Direct only
- tapOn:
    id: "button_direct"

# Apply filter (dbwShow = "Show X results" button)
- tapOn:
    id: "dbwShow"

# Results page still showing after filter applied
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- assertVisible:
    id: "flight_result_v4_inventory_card"


# ══════════════════════════════════════════════════════════════════════════════
# SCENARIO 03 — FILTER RESET: Apply direct filter, then reset all filters
# ══════════════════════════════════════════════════════════════════════════════

# Open filter dialog again (previous Direct filter is still active)
- tapOn:
    id: "flight_result_v4_filter_button"
- assertVisible:
    id: "layout_filter_dialog"

# Go to transit layer and reset
- tapOn:
    id: "layer_transit"
- assertVisible:
    id: "button_direct"

# Reset all filters (tvReset = "Reset" button in filter dialog)
- tapOn:
    id: "tvReset"

# After reset, all transit buttons should be unselected
- assertVisible:
    id: "button_direct"
- assertVisible:
    id: "button_one_transit"

# Apply with empty filter (full result set restored)
- tapOn:
    id: "dbwShow"
- assertVisible:
    id: "flight_result_v4_inventory_card"


# ══════════════════════════════════════════════════════════════════════════════
# SCENARIO 04 — SORT: Tap Sort button, verify tray opens, close
#
# NOTE: flight_result_v4_sort_button only appears in the navbar when the
# ViewModel's shouldDisplaySortButtonInNavbar == true. In the current build
# this flag is false, so sort is accessed via the floating BMButton at the
# bottom of the results list (Bloom DS: id "bm_button_text").
# Source: FlightResultV4SortAndFilterView.kt (if/shouldDisplaySortButtonInNavbar)
# ══════════════════════════════════════════════════════════════════════════════

# Tap the floating sort indicator button at the bottom of the results list
# (Bloom DS BMButton text element — one per screen when sort tray is closed)
- tapOn:
    id: "bm_button_text"

# Close sort tray with system back
- back

# Back on results page
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"


# ══════════════════════════════════════════════════════════════════════════════
# SCENARIO 05 — CARD DETAIL: Tap first card, verify navigation, close
# ══════════════════════════════════════════════════════════════════════════════

# Tap first flight card (index 0)
- tapOn:
    id: "flight_result_v4_inventory_card"
    index: 0

# Close detail (system back — avoids asserting specific dialog IDs which may vary)
- back

# Back on results list
- assertVisible:
    id: "flight_result_v4_inventory_card"


# ══════════════════════════════════════════════════════════════════════════════
# SCENARIO 06 — SCROLL: Scroll results list, verify cards still visible
# ══════════════════════════════════════════════════════════════════════════════

- assertVisible:
    id: "flight_result_v4_inventory_card"

# Scroll down (loads more cards via pagination)
- scroll

- assertVisible:
    id: "flight_result_v4_inventory_card"

# Scroll again
- scroll

- assertVisible:
    id: "flight_result_v4_inventory_card"


# ══════════════════════════════════════════════════════════════════════════════
# SCENARIO 07 — DATE FLOW: Verify date-flow strip is present and interactive
#
# Note: After scroll (scenario 06) the list is scrolled down.
# scrollUntilVisible brings the date-flow row back into viewport first.
# Individual date items inside flight_result_v4_date_flow_row (a LazyRow)
# do NOT have testTags (see FlightResultV4DateFlowComposeView.kt). Tapping a
# specific date requires text-based selection (brittle; moved to P1 test).
# P0 only verifies the strip renders correctly.
# ══════════════════════════════════════════════════════════════════════════════

# Scroll back to top so the date-flow header is in viewport
- scrollUntilVisible:
    element:
      id: "flight_result_v4_date_flow_row"
    direction: UP

- assertVisible:
    id: "flight_result_v4_date_flow_row"


# ══════════════════════════════════════════════════════════════════════════════
# SCENARIO 08 — BACK NAVIGATION: System back returns to search form
# ══════════════════════════════════════════════════════════════════════════════

# Use system back (Compose results page has no accessible back-button testTag)
- back

# Should now be on search form (flight_search_form_activity.xml)
- assertVisible:
    id: "btn_search"

# Re-navigate to results for Scenario 09
- tapOn:
    id: "btn_search"
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- assertVisible:
    id: "flight_result_v4_inventory_card"


# ══════════════════════════════════════════════════════════════════════════════
# SCENARIO 09 — CHANGE SEARCH: Header chevron opens search overlay
# ══════════════════════════════════════════════════════════════════════════════

# [Compose: FlightResultV4NavbarView]
# The ▼ chevron below the route title opens the inline search-change overlay
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_subtitle_chevron"
- tapOn:
    id: "flight_result_v4_navbar_toolbar_subtitle_chevron"

# Search form should become accessible
- assertVisible:
    id: "btn_search"
