appId: com.traveloka.android.staging
---

# Step 1: Navigate to search results
- launchApp
- assertVisible:
    id: "search_tab"  # Verify home screen is visible
- tapOn:
    id: "flights_tile"  # Tap "Flights" tile on home screen
- assertVisible:
    id: "layout_search_form"  # Verify search form is visible
- tapOn:
    id: "btn_search"  # Tap "Search" button
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to appear (up to 30s)

# Step 2: Apply restrictive filters to reach filtered empty state
- tapOn:
    id: "flight_result_v4_filter_button"  # Open filter dialog
- assertVisible:
    id: "layout_filter_dialog"  # Verify filter dialog is visible
- tapOn:
    id: "button_direct"  # Apply "Direct" filter
- tapOn:
    id: "button_one_transit"  # Apply "1 Stop" filter
- tapOn:
    id: "tvReset"  # Reset filters to create a restrictive empty state
- tapOn:
    id: "dbwShow"  # Apply filters
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for empty state to appear

# Step 3: Tap "Reset" button in empty state
- tapOn:
    id: "tvReset"  # Tap "Reset" button in empty state
- tapOn:
    id: "dbwShow"  # Apply reset filters

# Step 4: Wait for results to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to reload

# Step 5: Assert results are restored
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Verify flight cards are visible again