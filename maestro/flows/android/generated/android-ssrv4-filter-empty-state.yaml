appId: com.traveloka.android.staging
---

# Step 1: Launch the app and navigate to the flight search results page
- launchApp
- tapOn:
    id: "button_continue" # Dismiss optional onboarding
  whenVisible: true
- tapOn:
    id: "flights_tile" # Tap "Flights" tile on home screen
- assertVisible:
    id: "search_tab" # Verify search form is visible
- tapOn:
    id: "btn_search" # Tap "Search" button
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Wait for flight cards to appear (up to 30s)

# Step 2: Open the filter dialog
- tapOn:
    id: "flight_result_v4_filter_button" # Tap Filter button
- assertVisible:
    id: "layout_filter_dialog" # Verify filter dialog is visible

# Step 3: Apply restrictive filters
- tapOn:
    id: "button_direct" # On Transit tab, tap Direct
- tapOn:
    id: "layer_airline" # Switch to Airlines tab
- tapOn:
    id: "recycler_view_airline" # Tap second airline (index 1)
    index: 1
- tapOn:
    id: "recycler_view_airline" # Tap third airline (index 2)
    index: 2
- tapOn:
    id: "layer_time" # Switch to Time tab
- tapOn:
    id: "button_morning" # Tap Morning departure
- tapOn:
    id: "dbwShow" # Tap Apply button

# Step 4: Verify results or empty state
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Wait for flight cards to appear
  timeout: 30000
  optional: true
- extendedWaitUntil:
    id: "empty_state_view" # Wait for empty state UI to appear
  timeout: 30000
  optional: true
- takeScreenshot:
    path: "test-results/android/android-ssrv4-filter-empty-state.png"

# Step 5: Assert success criteria
- assertVisible:
    id: "empty_state_view" # Verify empty state UI appears
  optional: true
- assertVisible:
    id: "clear_filters_button" # Verify "Clear filters" or "Reset" button is visible
  optional: true