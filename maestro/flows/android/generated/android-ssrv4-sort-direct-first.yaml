appId: com.traveloka.android.staging
---
# Step 1: Navigate to search results
# Precondition: App launches to home screen
- launchApp
- assertVisible:
    id: "home_screen"

# Step 2: Dismiss optional onboarding if present
- optional:
    - tapOn:
        id: "button_continue"

# Step 3: Tap "Flights" tile on home screen
- tapOn:
    id: "flights_tile"

# Step 4: Verify search form is displayed with origin pre-filled
- assertVisible:
    id: "search_tab"

# Step 5: Tap "Search" button to navigate to results
- tapOn:
    id: "btn_search"

# Step 6: Wait up to 30s for flight cards to appear
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"

# Step 7: Wait for flight_result_v4_sort_button
- extendedWaitUntil:
    id: "flight_result_v4_sort_button"

# Step 8: Tap flight_result_v4_sort_button to open sort tray
- tapOn:
    id: "flight_result_v4_sort_button"

# Step 9: Wait for sort tray to appear
- extendedWaitUntil:
    id: "radio_button"

# Step 10: Tap radio_button at index 1 (Direct flight first)
- tapOn:
    id: "radio_button"
    index: 1

# Step 11: Wait for flight_result_v4_inventory_card to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"

# Success Criteria: Verify direct flight first sort applied without crash
- assertVisible:
    id: "flight_result_v4_inventory_card"