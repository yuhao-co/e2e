- extendedWaitUntil:
    visible:
      id: "primary_submit_button"
    timeout: 10000


- scroll

- tapOn:
    id: "primary_submit_button"

# Handle "There's repetition in this name" dialog (appears for Andini Andini etc.)
# Buttons inside widget_button have no resource-id (confirmed via uiautomator dump)
- runFlow:
    when:
      visible:
        id: "text_title"
    commands:
      - tapOn:
          text: "Yes, continue"


# --- PHASE 4.5: Contact Details — Fill Phone Number ---
# The Contact section shows "Fill In Contact Details *" if phone is missing.
# icon_fill_in_details: the "+" CTA in flight_booking_contact_detail_widget.xml
# Only tap if the contact section needs filling.
- runFlow:
    when:
      visible:
        id: "icon_fill_in_details"
    commands:
      - tapOn:
          id: "icon_fill_in_details"
      # primary_submit_button: Save CTA in contact dialog (confirmed via uiautomator dump)
      # tray_title "Contact Details" also confirms the dialog opened.
      - extendedWaitUntil:
          visible:
            id: "primary_submit_button"
          timeout: 10000
      # --- Country Code picker ---
      # Country Code EditText has no ID and no content-desc.
      # Bounds [74,1197][336,1359] → center = (205,1278) in device pixels (Pixel7 1080×2400).
      # Source: CountryPhoneSelector.kt → BMTextField (readOnly) wrapping the country field.
      - tapOn:
          point: "205,1278"
      # Wait for the country picker to open — "Close" button is the unique identifier.
      # NOTE: actual UI uses pickerHost path (full list view), NOT the BMModal with Cancel/Confirm.
      - extendedWaitUntil:
          visible:
            text: "Close"
          timeout: 10000
      # Search for China — pickerHost uses classic View picker (NOT Compose BMModal).
      # edit_text_search_constraint: confirmed via live uiautomator dump of the open picker.
      - tapOn:
          id: "edit_text_search_constraint"
      - inputText: "China"
      # text_view_country_name shows "China (CN)" — tapping selects and closes directly.
      - tapOn:
          text: "China (CN)"
      # --- Phone number ---
      # Use point coordinates directly to the Phone Number EditText [346,1197][1006,1359].
      # Center = (676,1278) — avoids ambiguity with the Country Code EditText on the left.
      # tapOn: label: "phoneNumber" hits the parent container center which is unreliable
      # after country code is set (layout may shift).
      - tapOn:
          point: "676,1278"
      # Erase any pre-filled phone number before typing (avoids appending to existing content).
      - eraseText
      - inputText: "13756321982"
      # Dismiss keyboard BEFORE tapping email — ensures clean focus transition.
      - hideKeyboard
      # --- Email ---
      # Email EditText: bounds [74,1401][1006,1563] → center (540,1482).
      # Use point coordinates — tapOn: label: "emailAddress" does not reliably shift focus
      # away from the phone field (focus stays on phone → eraseText deletes phone digits).
      - tapOn:
          point: "540,1482"
      - eraseText
      - inputText: "yu.hao@traveloka.com"
      - tapOn:
          id: "primary_submit_button"
      # "There's repetition in this name" dialog may appear inside contact save too
      - runFlow:
          when:
            visible:
              text: "There's repetition in this name"
          commands:
            - tapOn:
                text: "Yes, continue"
      # Back on booking form after saving contact
      - extendedWaitUntil:
          visible:
            id: "flight_booking_page_viewpager"
          timeout: 15000


