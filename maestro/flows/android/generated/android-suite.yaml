# ticket_option_select_button: from flight_ticket_option_slimming_down_widget.xml
- tapOn:
    id: "ticket_option_select_button"
    index: 0

# TURBULENCE-SAFE WAIT PATTERN:
# Step 1 — wait for the fare screen to DISMISS (works regardless of what comes next).
# flight_summary_activity_ticket_option_section disappears once the BFF call is made.
- extendedWaitUntil:
    notVisible:
      id: "flight_summary_activity_ticket_option_section"
    timeout: 20000

# Step 2 — if turbulence appeared instead of the booking form, tap Refresh.
# Source: flight_booking_activity.xml → error_button
- runFlow:
    when:
      visible:
        id: "error_button"
    commands:
      - tapOn:
          id: "error_button"

# Step 3 — now wait for the booking form (after clean load or after Refresh).
# flight_booking_page_viewpager: root of booking form (flightbooking_impl module)
- extendedWaitUntil:
    visible:
      id: "flight_booking_page_viewpager"
    timeout: 30000


# --- PHASE 4: Passenger — Select Existing Traveler ---
