appId: com.traveloka.android.staging
---
# Step 1: Launch the app
- launchApp

# Step 2: Tap on the "Flights" product tile
- tapOn:
    text: "Flights"  # Home screen product tile has NO android:id — text match is the ONLY contract

# Step 3: Assert that the search tab is visible
- assertVisible:
    id: "search_tab"

# Step 4: Tap on the search tab
- tapOn:
    id: "search_tab"

# Step 5: Assert that the search button is visible
- assertVisible:
    id: "btn_search"

# Step 6: Tap on the search button
- tapOn:
    id: "btn_search"  # btn_search is the blue Search CTA (hangar_widget.xml line 209)

# Step 7: Assert that the flight results page header is visible
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"

# Step 8: Wait until the flight inventory card is visible
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 9: Wait for the flight result container view to be visible
- extendedWaitUntil:
    visible:
      id: "flight_result_container_view"
    timeout: 30000

# Step 10: Tap on the flight result container view to open detail
- tapOn:
    id: "flight_result_container_view"

# Step 11: Wait for the detail overlay or new screen to be visible
- extendedWaitUntil:
    visible:
      id: "flight_detail_overlay"  # Assuming this is the ID for the detail overlay

# Step 12: Take a screenshot of the detail view
- screenshot:
    path: "test-results/android/android-results-view-detail.png"

# Step 13: Tap back to return to the results
- back

# Step 14: Assert that the flight result container is visible again
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Verifying that we are back to the results screen