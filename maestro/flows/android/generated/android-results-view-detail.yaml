appId: com.traveloka.android.staging
name: android-results-view-detail
---
# Step 1: Navigate to search results
- launchApp
- tapOn:
    text: "Flights"      # Home screen product tile has NO android:id — text match is the ONLY contract
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"     # btn_search is the blue Search CTA (hangar_widget.xml line 209)
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 2: Wait for flight_result_v4_inventory_card (Compose id)
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 3: Tap flight_result_v4_inventory_card (Compose id)
- tapOn:
    id: "flight_result_v4_inventory_card"

# Step 4: Wait for detail overlay or new screen
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"  # Assuming this ID is present in the detail view

# Step 5: Take screenshot
- screenshot:
    path: "test-results/android/android-results-view-detail.png"

# Step 6: Tap back to return to results (system back)
- back

# Step 7: Assert flight_result_v4_navbar_toolbar_title visible again (Compose id)
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"