appId: com.traveloka.android.staging
name: android-results-view-detail
---
# Step 1: Navigate to search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Wait for card_result (Compose id)
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 3: Tap card_result (Compose id)
- tapOn:
    id: "card_result"
    index: 0  # Assuming we want to tap the first flight card

# Step 4: Wait for detail overlay or new screen
- extendedWaitUntil:
    visible:
      id: "text_result_title"  # Assuming this ID is present in the detail view
    timeout: 30000

# Step 5: Take screenshot
- screenshot:
    path: "test-results/android/android-results-view-detail.png"

# Step 6: Tap back to return to results (system back)
- back

# Step 7: Assert text_result_title visible again (Compose id)
- assertVisible:
    id: "text_result_title"