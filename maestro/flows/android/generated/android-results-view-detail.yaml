appId: com.traveloka.android.staging
name: android-results-view-detail
---
# Step 1: Launch the app and navigate to the search results
- launchApp
- tapOn:
    text: "Flights"      # Home screen product tile — no testTag, text-only contract
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 2: Wait for the flight inventory card to be visible
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 3: Tap on the flight inventory card to open detail
- tapOn:
    id: "flight_result_v4_inventory_card"
    index: 0  # Assuming we want to tap the first card

# Step 4: Wait for the detail overlay or new screen to appear
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"  # Assuming this ID is present in the detail view
    timeout: 30000

# Step 5: Take a screenshot of the detail view
- takeScreenshot:
    path: "test-results/android/android-results-view-detail.png"

# Step 6: Tap back to return to the results
- back

# Step 7: Assert that the flight result navbar title is visible again
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"