appId: com.traveloka.android.staging
---
# SSR V4 Sort by Earliest Arrival
# Priority: p1
# Description: Open sort tray, tap index 4 (Earliest Arrival), verify reload

# Step 1: Launch app and navigate to search results
- launchApp
- assertVisible:
    id: "search_tab"  # Verify app launched to home screen
- tapOn:
    id: "search_tab"  # Tap "Flights" tile on home screen
- assertVisible:
    id: "layout_search_form"  # Verify search form is visible
- tapOn:
    id: "btn_search"  # Tap "Search" button to navigate to results
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to appear (up to 30s)

# Step 2: Wait for sort button to be visible
- assertVisible:
    id: "flight_result_v4_sort_button"  # Verify sort button is visible

# Step 3: Open sort tray
- tapOn:
    id: "flight_result_v4_sort_button"  # Tap sort button to open sort tray

# Step 4: Wait for sort tray to appear
- extendedWaitUntil:
    id: "radio_button"  # Wait for sort tray radio buttons to appear

# Step 5: Select "Earliest Arrival" sort option
- tapOn:
    id: "radio_button"
    index: 4  # Tap radio button at index 4 (Earliest Arrival)

# Step 6: Wait for results to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to reload

# Success Criteria: Verify sort applied without crash
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Verify flight cards are visible after reload