appId: com.traveloka.android.staging
---

# Step 1: Launch the app and navigate to the search results screen
- launchApp
- extendedWaitUntil:
    id: "home_screen" # Wait for the home screen to load
- tapOn:
    id: "flights_tile" # Tap on the "Flights" tile on the home screen
- extendedWaitUntil:
    id: "search_tab" # Wait for the search form to load
- tapOn:
    id: "btn_search" # Tap the "Search" button to navigate to the results page
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Wait for flight cards to appear (up to 30s)

# Step 2: Wait for the date flow row to be visible
- extendedWaitUntil:
    id: "flight_result_v4_date_flow_row" # Ensure the date flow row is visible

# Step 3: Scroll left on the date flow row to find tomorrow's date cell
- scrollUntilVisible:
    id: "flight_result_v4_date_flow_row" # Scroll within the date flow row to find the next day

# Step 4: Tap the next-day date cell in the date flow row
- tapOn:
    id: "flight_result_v4_date_flow_row" # Tap on the next-day date cell

# Step 5: Wait for the flight results to reload
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card" # Wait for the flight cards to reload

# Step 6: Assert that the flight results are visible
- assertVisible:
    id: "flight_result_v4_inventory_card" # Verify that the flight cards are visible after the date change