appId: com.traveloka.android.staging
---
# SSR V4 Mini-Filter Tray Dismiss
# Description: Open mini-filter tray and swipe down to dismiss without applying
# Priority: p1

# Step 1: Launch the app and navigate to the search results
- launchApp
- assertVisible:
    id: "search_tab"  # Verify app launched to home screen
- tapOn:
    id: "flights_tile"  # Tap "Flights" tile on home screen
- assertVisible:
    id: "layout_search_form"  # Verify search form is visible
- tapOn:
    id: "btn_search"  # Tap "Search" button to navigate to results
- extendedWaitUntil:
    id: "flight_result_v4_inventory_card"  # Wait for flight cards to appear (up to 30s)

# Step 2: Wait for the mini-filter tray to be accessible
- assertVisible:
    id: "flight_result_v4_quick_filter_cell"  # Verify quick filter chips are visible

# Step 3: Tap the first chip to open the mini-filter tray
- tapOn:
    id: "flight_result_v4_quick_filter_cell"  # Open mini-filter tray by tapping a chip

# Step 4: Wait for the mini-filter tray to appear
- assertVisible:
    id: "layout_filter_dialog"  # Verify the mini-filter tray is visible

# Step 5: Swipe down on the mini-filter tray to dismiss it
- swipe:
    direction: "down"  # Swipe down to dismiss the mini-filter tray

# Step 6: Assert the mini-filter tray is gone and results remain visible
- assertNotVisible:
    id: "layout_filter_dialog"  # Verify the mini-filter tray is dismissed
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Verify flight cards are still visible