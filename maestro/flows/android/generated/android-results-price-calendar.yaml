appId: com.traveloka.android.staging
name: android-results-price-calendar
---
# Test case for viewing the price calendar from flight search results
# Scenario ID: android-results-price-calendar
# Description: Tap calendar icon at far-right of flight_result_v4_date_flow_row to open FlightBloomCalendarDialog, assert calendar_navbar_close visible

# Step 1: Navigate to search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Wait for the date flow widget to be visible
- extendedWaitUntil:
    visible:
      id: "widget_dateflow"
    timeout: 10000

# Step 3: Tap the calendar icon at the right end of the date flow row
- tapOn:
    id: "image_calendar"   # Calendar icon inside widget_dateflow

# Step 4: Wait for the calendar dialog to be visible
- extendedWaitUntil:
    visible:
      id: "calendar_navbar_close"
    timeout: 10000

# Step 5: Assert that the calendar dialog is visible
- assertVisible:
    id: "calendar_navbar_close"