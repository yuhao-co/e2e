appId: com.traveloka.android.staging
name: android-results-filter-direct
---
# Test case for filtering direct (non-stop) flights
# Scenario: Open full filter dialog, apply Direct filter, verify results

# Step 1: Navigate to search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 2: Open full filter dialog
- tapOn:
    id: "flight_result_filter_button_title"
- extendedWaitUntil:
    visible:
      id: "layout_filter_dialog"
    timeout: 15000

# Step 3: Apply Direct flights filter
- tapOn:
    id: "button_direct"
- tapOn:
    id: "dbwShow"

# Step 4: Wait for results to reload and verify
- extendedWaitUntil:
    visible:
      id: "text_result_title"
    timeout: 30000
- assertVisible:
    id: "card_result"
