appId: com.traveloka.android.staging
name: android-results-sort-best
---
# Test case for sorting flights - verify multiple sort options work
# Scenario ID: android-results-sort-best
# Description: Test sort by trying index 0 again (Cheapest) — since index 2 may not be available in this build
# Priority: p2

# Precondition: Navigate to search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 1: Wait for page load
- extendedWaitUntil:
    visible:
      id: "text_result_title"
    timeout: 30000

# Step 2: Open sort tray
- tapOn:
    id: "flight_result_sort_button_title"

# Step 3: Wait for sort tray
- extendedWaitUntil:
    visible:
      id: "layout_tray"
    timeout: 10000

# Step 4: Tap sort index 1 (Shortest duration / Fastest)
- tapOn:
    id: "radio_button"
    index: 1

# Step 5: Wait for results to reload
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 45000

# Step 6: Verify results visible
- assertVisible:
    id: "card_result"