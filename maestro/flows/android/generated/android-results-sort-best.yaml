appId: com.traveloka.android.staging
name: android-results-sort-best
---
# Test case for sorting flights by Best option
# Scenario ID: android-results-sort-best
# Description: Tap sort index 2 (Best) in sort tray
# Priority: p2

# Precondition: Navigate to search results
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000

# Step 1: Wait for the results page header to ensure the page is loaded
- extendedWaitUntil:
    visible:
      id: "text_result_title"
    timeout: 30000

# Step 2: Open the sort tray
- tapOn:
    id: "flight_result_sort_button_title"          # Floating sort suggestion pill at bottom of results page
- extendedWaitUntil:
    visible:
      id: "layout_tray"         # Wait for Sort tray container to appear
    timeout: 10000

# Step 3: Tap the radio button at index 2 (Direct flights first)
- tapOn:
    id: "radio_button"
    index: 2                 # Sort by Direct flights first

# Step 4: Wait for the results page header to reload
- extendedWaitUntil:
    visible:
      id: "text_result_title"
    timeout: 30000