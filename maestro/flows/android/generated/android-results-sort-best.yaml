appId: com.traveloka.android.staging
name: android-results-sort-best
---
# Step 1: Navigate to search results
- launchApp
- tapOn:
    text: "Flights"      # Home screen product tile has NO android:id — text match is the ONLY contract
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"     # btn_search is the blue Search CTA (hangar_widget.xml line 209)
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 2: Wait for flight_result_v4_navbar_toolbar_title (Compose id)
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"
    timeout: 30000

# Step 3: Tap flight_result_v4_sort_button (Compose id) to open sort tray
- tapOn:
    id: "flight_result_v4_sort_button"

# Step 4: Wait for sort tray to appear
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_sort_button"
    timeout: 30000

# Step 5: Tap the radio_button at index 2 (Best) to sort by best value
- tapOn:
    id: "radio_button"
    index: 2

# Step 6: Wait for flight_result_v4_navbar_toolbar_title to reload
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_navbar_toolbar_title"
    timeout: 30000

# Success Criteria: Best sort applied, no crash
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"