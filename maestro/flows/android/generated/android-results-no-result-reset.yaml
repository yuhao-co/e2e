##
# SCENARIO 23 — No-result: Reset filter button visible when no flights match
#
# Source contract (android-v3 @ 2026-06-11):
#   FlightResultScreen.kt → btnResetFilter withText(button_message_no_flight_match)
#   flight_result_revamp_activity.xml → layout_error
#   This scenario intentionally applies a very narrow filter to trigger
#   the "no results" state, then verifies the reset CTA appears.
#
# Generated: 2026-06-11
##
appId: com.traveloka.android.staging
---

- runFlow: ../_navigate_to_results.yaml

# Apply both Direct AND Evening departure — very narrow, likely no results
- tapOn:
    id: "flight_result_v4_filter_button"

- assertVisible:
    id: "layout_filter_dialog"
# Select Direct
- tapOn:
    id: "layer_transit"
- assertVisible:
    id: "button_direct"
- tapOn:
    id: "button_direct"

# Select Evening departure only
- tapOn:
    id: "layer_time"
- assertVisible:
    id: "button_departure_evening"
- tapOn:
    id: "button_departure_evening"

# Apply
- tapOn:
    id: "dbwShow"

# If no results: layout_error or a "reset filter" CTA is shown.
# If results exist: inventory_parent_layout is shown (test still passes).
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
