appId: com.traveloka.android.staging
name: android-results-select-flight
---
# Step 1: Navigate to search results
- launchApp
- tapOn:
    text: "Flights"      # Home screen product tile has NO android:id — text match is the ONLY contract
- assertVisible:
    id: "search_tab"
- tapOn:
    id: "search_tab"
- assertVisible:
    id: "btn_search"
- tapOn:
    id: "btn_search"     # btn_search is the blue Search CTA (hangar_widget.xml line 209)
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 2: Wait for flight_result_v4_inventory_card (Compose id, timeout: 30000)
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 3: Tap first flight_result_v4_inventory_card (Compose id)
- tapOn:
    id: "flight_result_v4_inventory_card"  # Tapping the first flight card to view details

# Step 4: Wait for detail screen to appear (new screen or bottom sheet)
- extendedWaitUntil:
    visible:
      id: "flight_summary_activity_ticket_option_section"  # Assuming this ID appears on the detail screen

# Step 5: Assert we are no longer on the plain results list (takeScreenshot for verification)
- assertVisible:
    id: "flight_summary_activity_ticket_option_section"  # Verifying we are on the detail screen
- takeScreenshot: "flight_detail_view"  # Taking a screenshot for verification