appId: com.traveloka.android.staging
---
# Smoke: verify flight results page loads end-to-end

# Step 1: Launch
- launchApp

# Step 2: Tap Flights tile (text only — home tiles have NO android:id)
- tapOn:
    text: "Flights"

# Step 3: Assert search form visible
- assertVisible:
    id: "search_tab"

# Step 4: Tap search tab
- tapOn:
    id: "search_tab"

# Step 5: Assert Search button visible
- assertVisible:
    id: "btn_search"

# Step 6: Tap Search
- tapOn:
    id: "btn_search"

# Step 7: Wait for results toolbar
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"

# Step 8: Wait for at least one flight card
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 9: Final assertion
- assertVisible:
    id: "flight_result_v4_inventory_card"
