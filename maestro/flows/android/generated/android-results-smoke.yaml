appId: com.traveloka.android.staging
name: android-results-smoke
---
# Test case for verifying the search results page loads correctly
id: android-results-smoke
name: Search Results Page Loads
description: Navigate from home → search → results and verify flight cards appear
priority: p0

# Step 1: Launch the app
- launchApp

# Step 2: Tap on the "Flights" home screen tile (text-only contract)
- tapOn:
    text: "Flights"  # Home screen product tile — no testTag, text-only contract

# Step 3: Assert that the search tab is visible
- assertVisible:
    id: "search_tab"

# Step 4: Tap on the search tab
- tapOn:
    id: "search_tab"

# Step 5: Assert that the search button is visible
- assertVisible:
    id: "btn_search"

# Step 6: Tap on the search button
- tapOn:
    id: "btn_search"

# Step 7: Assert that the flight results navbar title is visible
- assertVisible:
    id: "flight_result_v4_navbar_toolbar_title"

# Step 8: Wait until at least one flight inventory card is visible
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"
    timeout: 30000

# Step 9: Assert that at least one flight inventory card is visible
- assertVisible:
    id: "flight_result_v4_inventory_card"  # Verify at least one card loaded