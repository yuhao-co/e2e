appId: com.traveloka.android.staging
name: android-results-smoke
---
# Smoke: navigate home → search → results, verify flight cards appear
- stopApp
- openLink:
    link: "traveloka://flight/fullsearch?ap=SIN.JKTA&dt=20260617&ps=1.0.0&sc=ECONOMY"
- extendedWaitUntil:
    visible:
      id: "card_result"
    timeout: 30000
- assertVisible:
    id: "card_result"
