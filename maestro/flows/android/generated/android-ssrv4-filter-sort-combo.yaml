appId: com.traveloka.android.staging
---
# Test Case ID: android-ssrv4-filter-sort-combo
# Name: SSR V4 Filter + Sort Combination
# Description: Apply Direct filter AND sort by cheapest — verify combined behavior
# Priority: p1

# Step 1: Navigate to search results
- launchApp: {}

# Step 2: Dismiss optional onboarding (if present)
- tapOn:
    id: "button_continue"

# Step 3: Tap "Flights" tile on home screen
- tapOn:
    id: "flights_tile"

# Step 4: Verify search form is displayed with origin pre-filled
- assertVisible:
    id: "layout_search_form"

# Step 5: Tap "Search" button to navigate to results
- tapOn:
    id: "btn_search"

# Step 6: Wait for flight cards to appear (up to 30 seconds)
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"

# Step 7: Tap filter button to open filter dialog
- tapOn:
    id: "flight_result_v4_filter_button"

# Step 8: On Transit tab, tap "Direct" filter
- tapOn:
    id: "button_direct"

# Step 9: Tap "Apply" button to apply the filter
- tapOn:
    id: "dbwShow"

# Step 10: Wait for flight cards to reload after applying filter
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"

# Step 11: Tap sort button to open sort tray
- tapOn:
    id: "flight_result_v4_sort_button"

# Step 12: Tap "Cheapest" sort option (radio_button index 0)
- tapOn:
    id: "radio_button"
    index: 0

# Step 13: Wait for flight cards to reload after sorting
- extendedWaitUntil:
    visible:
      id: "flight_result_v4_inventory_card"

# Step 14: Assert that flight cards are visible
- assertVisible:
    id: "flight_result_v4_inventory_card"

# Step 15: Take a screenshot for verification
- takeScreenshot:
    path: "test-results/android/android-ssrv4-filter-sort-combo.png"